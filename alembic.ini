# NOTE: keep this file pure ASCII.
# alembic reads it with the OS locale encoding (GBK on Chinese Windows),
# so any UTF-8 Chinese comment here raises UnicodeDecodeError.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The real DSN is loaded in alembic/env.py from settings.DATABASE_URL.
# Left blank on purpose: never commit a password here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
